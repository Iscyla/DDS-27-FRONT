<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Trabalhando com Inputs</h1>
    </header>
    <!-- INPUTs -->
    <main>
      <h2>Formulário de cadastro</h2>

      <!-- Input: Coleta as informações do usuário -->
      <!-- Form: Englobar os campos do frmulário -->
      <!-- Action: Pra onde vão essas informações preechindas -->
      <!-- Methood: Forma de como vão as informações -->
      <form action="">
        <!-- Label: Texto de apoio para guir o input -->
        <label for="nomeCompleto"> Nome Completo: </label>
        <!-- text: Caracter em geral -->
        <!-- name: Usado para identificar o input quando enviar os dados -->
        <!-- id: Identificaçã daquele elemento html -->
        <input type="text" name="nomeCompleto" id="nomeCompleto" />

        <br />
        <br />

        <!-- Input dentro label -->
        <label>
          Senha:
          <!-- password: senhas-->
          <input type="password" name="senha" id="senha" />
        </label>
      </form>
    </main>

    <footer></footer>
  </body>
</html>
