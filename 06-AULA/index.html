<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Tabelas top</h1>
    </header>

    <main>
      <h2>PRODUTOS</h2>
      <!-- Table: Criação da tabela -->
      <!--  Border: Propriedades da tabela -->
      <table border="1">
        <!-- Thead: Cabeçalho da tabela-->
        <thead>
          <!-- Tr: Criação de uma linha da tabela -->
          <tr>
            <!-- Th: coluna de um cabeçalho-->
            <th>ID</th>
            <th>Nome</th>
            <th>Quantidade</th>
            <th>Preço</th>
            <th>Categoria</th>
          </tr>
        </thead>
        <!-- Tbody: Corpo da tabela -->
        <tbody>
          <tr>
            <!-- Tb: Célula da linha do corpo-->
            <td>1</td>
            <td>Shampoo Kerastase</td>
            <td>7</td>
            <td>R$100</td>
            <td>Beleza</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Oreo do BTS</td>
            <td>10</td>
            <td>R$4</td>
            <td>Alimento</td>
          </tr>
          <tr>
            <td>3</td>
            <!-- Colspan: Diz quantas colunas a célula vai ocupar -->
            <td colspan="3">Mucilon</td>
            <!-- Rowspan: Diz quantas linhas a célula vai ocupar -->
            <td rowspan="2">filhos</td>
          </tr>
          <tr>
            <td>4</td>
            <td>Lavado nasal</td>
            <td>1</td>
            <td>R$30</td>
          </tr>
        </tbody>
        <!-- Tfoot: Rodapé da tabela -->
         <tfoot>
            <tr>
                <td colspan="5"> Tabela feita por: Alguém </td>
            </tr>
         </tfoot>                                                                                                                                                                  
      </table>
    </main>

    <footer></footer>
  </body>
</html>
